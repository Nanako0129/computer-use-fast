<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">How the skill handles a request</title>
  <desc id="d">Three tiers, first that works wins: a shell command with no window; one cu.py call that opens, clicks, types, reads and screenshots; step-by-step computer use only for apps without readable text.</desc>
  <style>
    .bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#8a8983}
    .box{fill:#ffffff;stroke:#d9d8d2}.hi{fill:#eaf2fc;stroke:#2a78d6}.arrow{stroke:#8a8983;fill:none}
    .tag{fill:#2a78d6}.code{fill:#f1f0ec}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.muted{fill:#8f8e86}
      .box{fill:#242422;stroke:#3a3936}.hi{fill:#1f2d40;stroke:#3987e5}.arrow{stroke:#8f8e86}
      .tag{fill:#3987e5}.code{fill:#2b2b28}
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8983"/></marker></defs>
  <rect class="bg" width="960" height="330" rx="12"/>
  <text class="ink" x="32" y="44" font-size="22" font-weight="700">How a GUI request is handled</text>
  <text class="ink2" x="32" y="70" font-size="15">The agent takes the first tier that works</text>

  <rect class="box" x="32" y="96" width="280" height="196" rx="12" stroke-width="1.5"/>
  <text class="muted" x="52" y="126" font-size="13" font-weight="600">TIER 1 · NO WINDOW</text>
  <text class="ink" x="52" y="156" font-size="18" font-weight="700">A shell command</text>
  <text class="ink2" x="52" y="184" font-size="14">Chip, memory, battery, OS</text>
  <text class="ink2" x="52" y="204" font-size="14">version, open a file or pane</text>
  <rect class="code" x="52" y="226" width="240" height="44" rx="6"/>
  <text class="mono ink" x="64" y="253" font-size="13">system_profiler …</text>

  <path class="arrow" d="M316 194 H336" stroke-width="2" marker-end="url(#a)"/>

  <rect class="hi" x="340" y="96" width="280" height="196" rx="12" stroke-width="2"/>
  <text class="tag" x="360" y="126" font-size="13" font-weight="700">TIER 2 · ONE CALL</text>
  <text class="ink" x="360" y="156" font-size="18" font-weight="700">cu.py runs the sequence</text>
  <text class="ink2" x="360" y="184" font-size="14">open → click → type → wait</text>
  <text class="ink2" x="360" y="204" font-size="14">→ read → screenshot, by text</text>
  <rect class="code" x="360" y="226" width="240" height="44" rx="6"/>
  <text class="mono ink" x="372" y="253" font-size="13">cu.py --app … --click …</text>

  <path class="arrow" d="M624 194 H644" stroke-width="2" marker-end="url(#a)"/>

  <rect class="box" x="648" y="96" width="280" height="196" rx="12" stroke-width="1.5"/>
  <text class="muted" x="668" y="126" font-size="13" font-weight="600">TIER 3 · FALLBACK</text>
  <text class="ink" x="668" y="156" font-size="18" font-weight="700">Step by step</text>
  <text class="ink2" x="668" y="184" font-size="14">Only apps without readable</text>
  <text class="ink2" x="668" y="204" font-size="14">text (Flutter, games, canvas)</text>
  <rect class="code" x="668" y="226" width="240" height="44" rx="6"/>
  <text class="mono ink" x="680" y="253" font-size="13">screenshot → click x,y</text>
</svg>
